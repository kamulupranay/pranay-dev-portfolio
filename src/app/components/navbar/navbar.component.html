<nav class="nav">
    <div class="nav-inner">
        <a class="brand" [routerLink]="['/']" fragment="home" (click)="close('home')">
            <span class="brand-mark">&lt;/&gt;</span>
            <span>PRANAY KAMULU</span>
        </a>
        <button class="menu" type="button" [attr.aria-expanded]="open()" aria-label="Toggle navigation"
            (click)="open.update(v=>!v)">
            <span></span><span></span><span></span>
        </button>
        <div class="links" [class.open]="open()">
            @for(link of links; track $index) {
            <a [routerLink]="['/']" [fragment]="link[0]" [class.active]="active()===link[0]"
                (click)="close(link[0])">{{link[1]}}
            </a>
            }
            <button class="theme" type="button"
                [attr.aria-label]="theme.dark()?'Switch to light mode':'Switch to dark mode'"
                (click)="theme.toggle()">{{theme.dark()?'☀':'☾'}}
            </button>
        </div>
    </div>
</nav>
